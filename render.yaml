databases:
  - name: eduquest-db
    plan: free

services:
  - type: web
    name: eduquest
    runtime: docker
    plan: free
    repo: https://github.com/yurisawaki/dsai-ap1-eduquest
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduquest-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_EXPIRATION_MINUTES
        value: "60"
      - key: RESET_TOKEN_EXPIRATION_MINUTES
        value: "60"
